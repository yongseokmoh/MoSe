name: MoSe Daily News Batch

on:
  schedule:
    - cron: '30 21 * * *' # KST 06:30 (UTC 21:30)
  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || github.token }}
        
      - name: 2. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 3. Run DeepSeek script (Primary Engine)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: node scripts/generate_deepseek_report.mjs
        
      - name: 4. Commit & Push
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/latest_report.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "✅ Auto-update daily news report (DeepSeek)" && git push)
